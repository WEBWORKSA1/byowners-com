<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "{{ site.url }}/#org",
      "name": "{{ site.title }}",
      "url": "{{ site.url }}/",
      "logo": "{{ '/assets/img/logo-512.png' | absolute_url }}",
      "description": {{ site.description | strip | jsonify }}
    },
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}/#website",
      "url": "{{ site.url }}/",
      "name": "{{ site.title }}",
      "publisher": { "@id": "{{ site.url }}/#org" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "{{ site.url }}/search/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }{% if page.url != "/" %},
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "{{ site.url }}/" }{% if page.collection == 'guides' %},
        { "@type": "ListItem", "position": 2, "name": "Guides", "item": "{{ site.url }}/guides/" },
        { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }{% elsif page.collection == 'listings' %},
        { "@type": "ListItem", "position": 2, "name": "Listings", "item": "{{ site.url }}/listings/" },
        { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }{% elsif page.parent_title %},
        { "@type": "ListItem", "position": 2, "name": {{ page.parent_title | jsonify }}, "item": "{{ page.parent_url | absolute_url }}" },
        { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }{% else %},
        { "@type": "ListItem", "position": 2, "name": {{ page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }{% endif %}
      ]
    }{% endif %}{% if page.collection == 'guides' %},
    {
      "@type": "Article",
      "headline": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "datePublished": "{{ page.date | date_to_xmlschema }}",
      "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
      "author": { "@type": "Organization", "name": "{{ site.author }}", "url": "{{ site.url }}/about/" },
      "publisher": { "@id": "{{ site.url }}/#org" },
      "mainEntityOfPage": "{{ page.url | absolute_url }}",
      "image": "{{ site.og_image | absolute_url }}"
    }{% endif %}{% if page.faqs %},
    {
      "@type": "FAQPage",
      "mainEntity": [{% for f in page.faqs %}
        { "@type": "Question", "name": {{ f.q | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ f.a | jsonify }} } }{% unless forloop.last %},{% endunless %}{% endfor %}
      ]
    }{% endif %}{% if page.tool_schema or layout.tool_schema %},
    {
      "@type": "WebApplication",
      "name": {{ page.title | jsonify }},
      "url": "{{ page.url | absolute_url }}",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }{% endif %}
  ]
}
</script>
