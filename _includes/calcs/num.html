<div class="field"><label for="f-{{ include.k }}">{{ include.label }}{% if include.unit %} <span class="muted">({{ include.unit }})</span>{% endif %}</label><input type="number" id="f-{{ include.k }}" data-k="{{ include.k }}" value="{{ include.value }}" step="{{ include.step | default: 'any' }}" min="0" inputmode="decimal">{% if include.hint %}<span class="hint">{{ include.hint }}</span>{% endif %}</div>
